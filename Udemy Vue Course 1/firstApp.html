<html>
    <head>
        <title>Vue 3 example</title>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <body>
            <div id="app">
                <p>Counter: {{counter}} </p>
                <button @click="counter--">Remove</button>
                <button @click="counter++">Add</button>
                <p v-if="counter >= 15">Calm down!!</p>
                <p v-else-if="counter >= 5">starting to heat up</p>
            </div>

            <script>
                const { createApp, ref } = Vue;

                createApp({
                    setup() {
                        const counter = ref(0)
                        return { counter }
                    }
                }).mount('#app')
            </script>
        </body>
    </head>
</html>
